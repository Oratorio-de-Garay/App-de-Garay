# Calidad de la aplicación: lint, formato, tipos y tests unitarios en cada PR
# (contra test o contra main), y tests de integración y de punta a punta contra
# una base local efímera dentro del runner (no toca producción) sólo en los PR
# contra main, o sea cuando se mergea test en main.
#
# Ninguno de los dos corre si el PR sólo toca documentación (*.md, docs/).
# Se resuelve con un job `cambios` y no con `paths-ignore` a propósito: un
# check requerido que el workflow ni siquiera arranca queda "pendiente" para
# siempre y bloquea el merge, mientras que un job salteado cuenta como aprobado.
name: Aplicación

on:
  pull_request:
    branches: [main, test]

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cambios:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      codigo: ${{ steps.filtro.outputs.codigo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Hay código si algún archivo modificado no es documentación.
      - id: filtro
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -qvE '(\.md$|^docs/)'; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          fi

  calidad:
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Tests unitarios
        run: npm test

  integracion-y-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [cambios, calidad]
    # Sólo al mergear test en main; los PR contra test no lo corren.
    if: needs.cambios.outputs.codigo == 'true' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - run: npm ci

      # Postgres, Auth, PostgREST y Mailpit, con todas las migraciones y seed.sql.
      - name: Levantar Supabase local
        run: supabase start

      # Mismo archivo que se usa en desarrollo, armado con las claves de la
      # base efímera del runner.
      - name: Variables de entorno
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a && . "$RUNNER_TEMP/supabase.env" && set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SMTP_HOST=127.0.0.1"
            echo "SMTP_PORT=54325"
            echo "MAIL_FROM=Oratorio de Garay <no-responder@local.test>"
            echo "APP_URL=http://localhost:3100"
          } > .env.local

      - name: Tests de integración de la API
        run: npm run test:integration

      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de punta a punta
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
