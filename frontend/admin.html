<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Administración · Oratorio</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="admin.css">
</head>
<!-- data-page="admin": auth.js no muestra el selector de organización acá y no
     redirige al superadmin sin organizaciones. -->
<body data-page="admin">
  <header>
    <div class="header-top">
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Abrir menú" aria-controls="side-nav" aria-expanded="false" hidden>
        <span class="nav-toggle-bars"><span></span><span></span><span></span></span>
      </button>
      <div class="dot"></div>
      <div>
        <div class="header-title">Administración</div>
        <div class="header-sub">Usuarios, roles y organizaciones</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-logout" id="btn-logout" type="button" hidden>Salir</button>
    </div>
  </header>

  <div class="auth-screen" id="auth-screen" hidden>
    <div class="auth-card" id="auth-card"></div>
  </div>

  <div id="app-shell" hidden class="app-layout">
    <div class="nav-scrim" id="nav-scrim"></div>

    <aside class="side-nav" id="side-nav">
      <button class="side-nav-close" id="nav-close" type="button" aria-label="Cerrar menú">&times;</button>
      <a class="side-link" href="index.html">Registro</a>
      <a class="side-link" href="buffet.html">Buffet</a>
      <a class="side-link side-link-admin active" href="admin.html">Administración</a>
    </aside>

    <main class="app-main admin-main" id="admin-main">
      <section class="admin-hero">
        <div class="admin-hero-text">
          <div class="admin-kicker">Panel de administración</div>
          <h1>Usuarios y permisos</h1>
          <p id="admin-scope">Cargando tus permisos…</p>
        </div>
        <div class="admin-stats" id="admin-stats"></div>
      </section>

      <nav class="admin-tabs" id="admin-tabs" role="tablist" aria-label="Secciones del panel">
        <button class="admin-tab active" type="button" role="tab" data-tab="usuarios" aria-selected="true">Usuarios</button>
        <button class="admin-tab" type="button" role="tab" data-tab="roles" data-solo-superadmin hidden>Roles</button>
        <button class="admin-tab" type="button" role="tab" data-tab="organizaciones" data-solo-superadmin hidden>Organizaciones</button>
        <button class="admin-tab" type="button" role="tab" data-tab="actividad">Actividad</button>
      </nav>

      <section class="admin-panel active" id="panel-usuarios" role="tabpanel"></section>
      <section class="admin-panel" id="panel-roles" role="tabpanel"></section>
      <section class="admin-panel" id="panel-organizaciones" role="tabpanel"></section>
      <section class="admin-panel" id="panel-actividad" role="tabpanel"></section>
    </main>

    <div class="modal-overlay admin-modal-overlay" id="admin-modal-overlay">
      <div class="modal admin-modal" id="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title"></div>
    </div>

    <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  </div>

  <script>
    window.API_URL = "";
    window.SUPABASE_URL = "https://tcrrxgqwuxlykwyeymsp.supabase.co";
    window.SUPABASE_ANON_KEY = "sb_publishable_86o3bgdc_aHgXPhTW7AzRQ_PH4yHoNT";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="auth.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="admin.js" defer></script>
</body>
</html>
