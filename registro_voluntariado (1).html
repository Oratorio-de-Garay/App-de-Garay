<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Registro · Voluntariado</title>
<style>
  :root {
    --verde: #1a3a2a;
    --verde-light: #e8f5ee;
    --verde-mid: #4caf78;
    --verde-soft: #d0e8d8;
    --texto: #1a1a1a;
    --texto-sec: #6b7280;
    --borde: #e5e7eb;
    --bg: #f9fafb;
    --card: #ffffff;
    --amarillo-bg: #fffbeb;
    --amarillo-borde: #f0c040;
    --amarillo-txt: #7a5200;
    --rojo-bg: #fde8e0;
    --rojo-txt: #7c2610;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--texto); min-height: 100vh; }

  header { background: var(--verde); padding: 16px 18px 14px; position: sticky; top: 0; z-index: 10; }
  .header-top { display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--verde-mid); }
  .header-title { color: var(--verde-light); font-size: 16px; font-weight: 600; letter-spacing: 0.2px; }
  .header-sub { color: #7ab895; font-size: 12px; margin-top: 2px; }

  .search-box { padding: 14px 16px; background: var(--card); border-bottom: 1px solid var(--borde); }
  .search-row { display: flex; gap: 8px; }
  .search-input {
    flex: 1; border: 1.5px solid var(--borde); border-radius: 10px;
    padding: 12px 14px; font-size: 16px; background: var(--bg);
    color: var(--texto); outline: none; transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--verde-mid); }
  .search-btn {
    background: var(--verde); color: white; border: none; border-radius: 10px;
    padding: 0 18px; font-size: 15px; cursor: pointer; display: flex;
    align-items: center; gap: 6px; font-weight: 500; transition: opacity 0.15s;
  }
  .search-btn:active { opacity: 0.8; }

  .content { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--card); border-radius: 14px; border: 1px solid var(--borde);
    overflow: hidden;
  }
  .card-header { padding: 14px; display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; background: var(--verde-soft);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px; color: var(--verde); flex-shrink: 0;
  }
  .card-name { font-size: 16px; font-weight: 600; color: var(--texto); }
  .card-meta { font-size: 13px; color: var(--texto-sec); margin-top: 2px; }

  .card-body { border-top: 1px solid var(--borde); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .info-row { display: flex; justify-content: space-between; align-items: center; }
  .info-label { font-size: 14px; color: var(--texto-sec); }
  .badge { font-size: 12px; padding: 4px 12px; border-radius: 999px; font-weight: 600; }
  .badge-si { background: #d4ede0; color: #0f5c2e; }
  .badge-no { background: var(--rojo-bg); color: var(--rojo-txt); }
  .obs-box {
    background: var(--bg); border-radius: 8px; padding: 9px 11px;
    font-size: 13px; color: var(--texto-sec); font-style: italic;
    border: 1px solid var(--borde); line-height: 1.45;
  }

  .card-actions { display: flex; gap: 8px; padding: 10px 14px 14px; }
  .btn-main {
    flex: 1; background: var(--verde); color: white; border: none;
    border-radius: 10px; padding: 13px; font-size: 14px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 8px; transition: opacity 0.15s;
  }
  .btn-main:active { opacity: 0.8; }
  .btn-main.done { background: #888; }
  .btn-sec {
    background: transparent; color: var(--texto-sec);
    border: 1.5px solid var(--borde); border-radius: 10px;
    padding: 13px 16px; font-size: 14px; cursor: pointer; transition: background 0.15s;
  }
  .btn-sec:active { background: var(--borde); }

  .alert {
    padding: 12px 14px; border-radius: 12px; font-size: 13px;
    display: flex; align-items: flex-start; gap: 10px; line-height: 1.5;
  }
  .alert-warn { background: var(--amarillo-bg); border: 1px solid var(--amarillo-borde); color: var(--amarillo-txt); }
  .alert-info { background: #e8f0fe; border: 1px solid #c5d5f7; color: #1a3a7a; }
  .alert-ok   { background: #e6f4ea; border: 1px solid #a8d5b0; color: #0f5c2e; }
  .alert-err  { background: var(--rojo-bg); border: 1px solid #f5c4b3; color: var(--rojo-txt); }
  .alert-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }

  /* Formulario nuevo chico */
  .form-card { background: var(--card); border-radius: 14px; border: 1px solid var(--borde); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .form-title { font-size: 15px; font-weight: 600; color: var(--texto); }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: 12px; color: var(--texto-sec); text-transform: uppercase; letter-spacing: 0.5px; }
  .form-input {
    border: 1.5px solid var(--borde); border-radius: 10px;
    padding: 11px 13px; font-size: 15px; background: var(--bg);
    color: var(--texto); outline: none; transition: border-color 0.15s;
  }
  .form-input:focus { border-color: var(--verde-mid); }
  .form-select {
    border: 1.5px solid var(--borde); border-radius: 10px;
    padding: 11px 13px; font-size: 15px; background: var(--bg);
    color: var(--texto); outline: none; width: 100%; appearance: none;
  }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .multi-results { display: flex; flex-direction: column; gap: 8px; }
  .result-item {
    background: var(--card); border: 1px solid var(--borde); border-radius: 12px;
    padding: 13px 14px; display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; transition: background 0.1s;
  }
  .result-item:active { background: var(--bg); }
  .result-item-left { display: flex; align-items: center; gap: 10px; }
  .result-item-name { font-size: 15px; font-weight: 500; }
  .result-item-meta { font-size: 12px; color: var(--texto-sec); }

  /* Modal edición */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: flex-end; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--card); border-radius: 20px 20px 0 0; padding: 20px 16px;
    width: 100%; transform: translateY(20px); transition: transform 0.2s;
    display: flex; flex-direction: column; gap: 14px;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-actions { display: flex; gap: 8px; padding-top: 4px; }

  .url-box {
    background: var(--amarillo-bg); border: 1px solid var(--amarillo-borde);
    border-radius: 12px; padding: 14px; font-size: 13px; color: var(--amarillo-txt);
    line-height: 1.6;
  }
  .url-input-row { display: flex; gap: 8px; margin-top: 10px; }
  .url-input { flex: 1; border: 1.5px solid var(--amarillo-borde); border-radius: 8px; padding: 10px 12px; font-size: 13px; background: white; color: var(--texto); outline: none; }
  .url-save-btn { background: var(--verde); color: white; border: none; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  input[type=checkbox] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--verde); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="dot"></div>
    <div>
      <div class="header-title">Registro de ingreso</div>
      <div class="header-sub" id="fecha-hoy"></div>
    </div>
  </div>
</header>

<div class="search-box">
  <div class="search-row">
    <input class="search-input" type="text" id="input-apellido"
      placeholder="Apellido del chico..." autocomplete="off" autocorrect="off"
      autocapitalize="words" spellcheck="false" />
    <button class="search-btn" id="btn-buscar" onclick="buscar()">
      <span id="btn-buscar-icon">Buscar</span>
    </button>
  </div>
</div>

<div class="content" id="contenido">

</div>

<!-- Modal editar -->
<div class="modal-overlay" id="modal-overlay" onclick="cerrarModal(event)">
  <div class="modal">
    <div class="modal-title">Editar datos</div>
    <div class="form-group">
      <label class="form-label">Ficha presentada</label>
      <select class="form-select" id="edit-ficha">
        <option value="Sí">✅ Sí, trajo la ficha</option>
        <option value="No">❌ No trajo la ficha</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Observaciones</label>
      <input class="form-input" type="text" id="edit-obs" placeholder="Observación..." />
    </div>
    <div class="modal-actions">
      <button class="btn-main" id="btn-guardar-edit" onclick="guardarEdicion()" style="flex:1;">Guardar cambios</button>
      <button class="btn-sec" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
// ⬇️ PEGÁ ACA TU URL DE APPS SCRIPT (entre las comillas)
const urlScript = "https://script.google.com/macros/s/AKfycbwiUjEWYIJGy3AR00wULyzsYCxKYarvpkkGC6bq3Abf_5zGgAtKIpzJl2JTP3_N3Lfr/exec";

let filaActual = null;
let nombreActual = "";
let marcadoPresente = false;

function init() {
  const hoy = new Date();
  const dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  document.getElementById("fecha-hoy").textContent =
    `${dias[hoy.getDay()]} ${hoy.getDate()} ${meses[hoy.getMonth()]}`;

  document.getElementById("input-apellido").addEventListener("keydown", e => {
    if (e.key === "Enter") buscar();
  });
}

async function buscar() {
  const apellido = document.getElementById("input-apellido").value.trim();
  if (!apellido) return;
  setBtnCargando(true);
  marcadoPresente = false;
  limpiarContenido();

  try {
    const res = await fetch(`${urlScript}?action=buscar&apellido=${encodeURIComponent(apellido)}`);
    const data = await res.json();

    if (data.length === 0) {
      mostrarNuevoChico(apellido);
    } else if (data.length === 1) {
      mostrarResultado(data[0]);
    } else {
      mostrarMultiples(data);
    }
  } catch(e) {
    mostrarMensaje("err", "❌ No se pudo conectar. Verificá la URL o tu conexión a internet.");
  } finally {
    setBtnCargando(false);
  }
}

function mostrarResultado(chico) {
  filaActual = chico.fila;
  nombreActual = chico.nombre;

  const iniciales = chico.nombre.split(" ").slice(0,2).map(p => p[0]).join("").toUpperCase();
  const tieneFicha = String(chico.ficha).toLowerCase() === "sí" || String(chico.ficha).toLowerCase() === "si";
  const obs = chico.obs ? `<div class="obs-box">💬 ${chico.obs}</div>` : "";
  const visitas = chico.visitas || 0;

  const html = `
    <div class="card" id="card-resultado">
      <div class="card-header">
        <div class="avatar">${iniciales}</div>
        <div>
          <div class="card-name">${chico.nombre}</div>
          <div class="card-meta">${chico.grado || "Sin grado"} · ${chico.edad || ""}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="info-row">
          <span class="info-label">📋 Ficha</span>
          <span class="badge ${tieneFicha ? 'badge-si' : 'badge-no'}">${tieneFicha ? 'Presentó ✓' : 'No presentó ✗'}</span>
        </div>
        <div class="info-row">
          <span class="info-label">📅 Visitas este año</span>
          <strong>${visitas}</strong>
        </div>
        ${obs}
      </div>
      <div class="card-actions">
        <button class="btn-main" id="btn-presente" onclick="marcarPresente()">✓ Marcar presente</button>
        <button class="btn-sec" onclick="abrirModal()">✏️</button>
      </div>
    </div>
  `;

  agregarHTML(html);
}

function mostrarMultiples(chicos) {
  let items = chicos.map(c => {
    const iniciales = c.nombre.split(" ").slice(0,2).map(p=>p[0]).join("").toUpperCase();
    return `
      <div class="result-item" onclick='seleccionarChico(${JSON.stringify(c)})'>
        <div class="result-item-left">
          <div class="avatar" style="width:36px;height:36px;font-size:12px;">${iniciales}</div>
          <div>
            <div class="result-item-name">${c.nombre}</div>
            <div class="result-item-meta">${c.grado || "Sin grado"} · ${c.edad || ""}</div>
          </div>
        </div>
        <span style="color:#9ca3af;font-size:18px;">›</span>
      </div>
    `;
  }).join("");

  agregarHTML(`
    <div class="alert alert-info">
      <span class="alert-icon">👥</span>
      <span>Se encontraron ${chicos.length} chicos. Elegí uno:</span>
    </div>
    <div class="multi-results">${items}</div>
  `);
}

function seleccionarChico(chico) {
  limpiarContenido();
  mostrarResultado(chico);
}

function mostrarNuevoChico(apellido) {
  agregarHTML(`
    <div class="alert alert-warn">
      <span class="alert-icon">⚠️</span>
      <span>No se encontró "<strong>${apellido}</strong>". Si es la primera vez que viene, completá los datos:</span>
    </div>
    <div class="form-card">
      <div class="form-title">Nuevo chico</div>
      <div class="form-group">
        <label class="form-label">Nombre y apellido completo</label>
        <input class="form-input" type="text" id="nuevo-nombre" value="${apellido}" autocapitalize="words" />
      </div>
      <div class="form-group">
        <label class="form-label">Grado</label>
        <input class="form-input" type="text" id="nuevo-grado" placeholder="Ej: 1°, 4°, Sala 5" autocapitalize="words" />
      </div>
      <div class="form-group">
        <label class="form-label">¿Trajo la ficha?</label>
        <select class="form-select" id="nuevo-ficha">
          <option value="Sí">✅ Sí, trajo la ficha</option>
          <option value="No">❌ No trajo la ficha</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Categoría</label>
        <select class="form-select" id="nuevo-edad">
          <option value="Chiquitos">Chiquitos</option>
          <option value="Medianos">Medianos</option>
          <option value="Grandes">Grandes</option>
          <option value="Gigantes">Gigantes</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Observaciones (opcional)</label>
        <input class="form-input" type="text" id="nuevo-obs" placeholder="Ej: pendiente de ficha médica..." />
      </div>
      <button class="btn-main" id="btn-agregar" onclick="agregarNuevo()">+ Agregar y marcar presente</button>
    </div>
  `);
}

async function marcarPresente() {
  if (marcadoPresente) return;
  const btn = document.getElementById("btn-presente");
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled = true;

  try {
    await fetch(urlScript, {
      method: "POST",
      body: JSON.stringify({ action: "marcarPresente", nombre: nombreActual })
    });
    marcadoPresente = true;
    btn.textContent = "✓ Presente marcado";
    btn.classList.add("done");
    document.getElementById("card-resultado").insertAdjacentHTML("afterend",
      `<div class="alert alert-ok"><span class="alert-icon">🎉</span><span>Presente marcado para hoy. ¡Listo!</span></div>`
    );
  } catch(e) {
    btn.textContent = "✓ Marcar presente";
    btn.disabled = false;
    mostrarMensaje("err", "❌ Error al guardar. Intentá de nuevo.");
  }
}

async function agregarNuevo() {
  const nombre = document.getElementById("nuevo-nombre").value.trim();
  const grado  = document.getElementById("nuevo-grado").value.trim();
  const ficha  = document.getElementById("nuevo-ficha").value;
  const edad   = document.getElementById("nuevo-edad").value;
  const obs    = document.getElementById("nuevo-obs").value.trim();

  if (!nombre) { alert("Ingresá el nombre completo."); return; }

  const btn = document.getElementById("btn-agregar");
  btn.innerHTML = '<span class="spinner"></span> Guardando...';
  btn.disabled = true;

  try {
    await fetch(urlScript, {
      method: "POST",
      body: JSON.stringify({ action: "agregarNuevo", nombre, grado, ficha, edad, obs })
    });
    limpiarContenido();
    agregarHTML(`<div class="alert alert-ok"><span class="alert-icon">🎉</span><span><strong>${nombre}</strong> fue agregado y el presente quedó marcado para hoy.</span></div>`);
    document.getElementById("input-apellido").value = "";
  } catch(e) {
    btn.textContent = "+ Agregar y marcar presente";
    btn.disabled = false;
    mostrarMensaje("err", "❌ Error al guardar. Intentá de nuevo.");
  }
}

function abrirModal() {
  document.getElementById("edit-obs").value = "";
  document.getElementById("modal-overlay").classList.add("open");
}

function cerrarModal(e) {
  if (!e || e.target === document.getElementById("modal-overlay")) {
    document.getElementById("modal-overlay").classList.remove("open");
  }
}

async function guardarEdicion() {
  const ficha = document.getElementById("edit-ficha").value;
  const obs   = document.getElementById("edit-obs").value.trim();
  const btn   = document.getElementById("btn-guardar-edit");
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled = true;

  try {
    await fetch(urlScript, {
      method: "POST",
      body: JSON.stringify({ action: "editarFicha", fila: filaActual, ficha, obs })
    });
    cerrarModal();
    btn.textContent = "Guardar cambios";
    btn.disabled = false;
    mostrarMensaje("ok", "✅ Datos actualizados correctamente.");
    setTimeout(() => buscar(), 500);
  } catch(e) {
    btn.textContent = "Guardar cambios";
    btn.disabled = false;
  }
}

function setBtnCargando(cargando) {
  const btn = document.getElementById("btn-buscar-icon");
  btn.innerHTML = cargando ? '<span class="spinner"></span>' : 'Buscar';
  document.getElementById("btn-buscar").disabled = cargando;
}

function limpiarContenido() {
  const c = document.getElementById("contenido");
  c.innerHTML = "";
}

function agregarHTML(html) {
  document.getElementById("contenido").insertAdjacentHTML("beforeend", html);
}

function mostrarMensaje(tipo, msg) {
  const clases = { ok: "alert-ok", warn: "alert-warn", info: "alert-info", err: "alert-err" };
  agregarHTML(`<div class="alert ${clases[tipo]}">${msg}</div>`);
}

init();
</script>
</body>
</html>
